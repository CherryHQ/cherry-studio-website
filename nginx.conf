map $host $docs_locale {
    default en;
    ~(^|\.)cherryai\.com\.cn$ zh-cn;
    ~(^|\.)cherry-ai\.com$ zh-cn;
}

server {
    listen 80;
    server_name cherryai.com www.cherryai.com www.cherry-ai.com cherry-ai.com cherryai.com.cn www.cherryai.com.cn;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /docs { return 302 /docs/$docs_locale/; }
    location = /docs/ { return 302 /docs/$docs_locale/; }

    # Docs have real static pages and a real 404, never the marketing SPA.
    location ^~ /docs/ {
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
    }

    # SPA fallback - handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
