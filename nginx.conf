# Only fingerprinted resources may outlive a deployment in the browser cache.
map $uri $site_cache_control {
    default "public, max-age=0, must-revalidate";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8}\.[^/]+$" "public, max-age=31536000, immutable";
    ~^/docs/_next/static/ "public, max-age=31536000, immutable";
    ~^/docs/content-assets/ "public, max-age=31536000, immutable";
}

map $host $docs_locale {
    default en;
    ~(^|\.)cherryai\.com\.cn$ zh-cn;
    ~(^|\.)cherry-ai\.com$ zh-cn;
}

server {
    listen 80;
    server_name cherryai.com www.cherryai.com www.cherry-ai.com cherry-ai.com cherryai.com.cn www.cherryai.com.cn;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Missing assets must not fall back to the SPA HTML.
    location /assets/ {
        try_files $uri =404;
    }

    location = /docs { return 302 /docs/$docs_locale/; }
    location = /docs/ { return 302 /docs/$docs_locale/; }

    # Docs have real static pages and a real 404, never the marketing SPA.
    location ^~ /docs/ {
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
    }

    # SPA fallback - handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header Cache-Control $site_cache_control;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
