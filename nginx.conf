map $arg_region $release_region {
    default cn;
    global global;
}

server {
    listen 80;
    server_name www.cherry-ai.com cherry-ai.com cherryai.com.cn www.cherryai.com.cn;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Resolve the public RC client target without exposing the upstream redirect
    # to browser JavaScript. The release service remains the source of truth.
    location = /_release/client/rc {
        proxy_pass https://releases.cherry-ai.com/rc.yml;
        proxy_ssl_server_name on;
        proxy_set_header Host releases.cherry-ai.com;
        proxy_set_header X-Region $release_region;
        proxy_set_header X-Release-Channel production;
        proxy_set_header App-Version "";
        proxy_set_header Client-Id "";
        proxy_set_header X-Client-Id "";
        proxy_intercept_errors on;
        error_page 302 = @release_client_metadata;
    }

    location @release_client_metadata {
        add_header Cache-Control "no-store" always;
        add_header X-Release-Version $upstream_http_x_release_version always;
        add_header X-Release-Mirror $upstream_http_x_release_mirror always;
        add_header X-Release-Policy $upstream_http_x_release_policy always;
        add_header X-Release-Manifest $upstream_http_location always;
        return 204;
    }

    # Keep every installer click behind release validation and select the mirror
    # from the website region before returning the upstream download redirect.
    location /_release/download/ {
        proxy_pass https://releases.cherry-ai.com/download/;
        proxy_ssl_server_name on;
        proxy_set_header Host releases.cherry-ai.com;
        proxy_set_header X-Region $release_region;
        proxy_pass_request_body off;
    }

    # SPA fallback - handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
