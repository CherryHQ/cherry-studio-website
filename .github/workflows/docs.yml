name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Main releases are guarded/serialized by the container job. A checks-only run
  # must not replace a queued product build in the workflow concurrency group.
  group: docs-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Content and lint checks: locale-independent, so they run once and fail fast.
  checks:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No version input: action-setup reads packageManager from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Determine build impact
        id: changes
        run: node .github/scripts/build-impact.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Content conversion tests
        run: pnpm docs:test

      - name: CI script tests
        run: node --test .github/scripts/*.test.cjs

      - name: Generate documentation content
        run: pnpm docs:generate

      # generate-content.mjs only exits non-zero for its fatal issue types, so assert zero issues here.
      - name: Require zero reported source issues
        run: |
          node -e "const r=require('./docs-site/generated/report.json'); if (r.issues.length) { console.error(JSON.stringify(r.issues, null, 2)); process.exit(1); } console.log('report.json: 0 source issues');"

      - name: Content link and file checks
        run: pnpm docs:lint

      - name: Lint and format check
        run: pnpm exec biome ci .

  # Build both deployable locales in parallel: build:cn is what `pnpm release` and the Docker
  # image ship, build:en is the default. Each build also re-runs the docs generation internally.
  build:
    needs: checks
    if: needs.checks.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [en, cn]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (${{ matrix.locale }})
        run: pnpm build:${{ matrix.locale }}

      - name: Verify the exported site
        run: pnpm docs:verify

  container:
    needs: [checks, build]
    if: needs.checks.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Complete the current write before starting another release. The updater also
    # checks main and uses the GitOps file SHA to reject stale/concurrent writes.
    concurrency:
      group: website-container-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: docker/setup-buildx-action@v4

      - name: Build the production Dockerfile without credentials
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: website-test:${{ github.sha }}
          cache-from: type=gha,scope=website-container
          cache-to: type=gha,scope=website-container,mode=max

      - name: Smoke test the container
        env:
          TEST_IMAGE: website-test:${{ github.sha }}
        run: bash .github/scripts/smoke-container.sh

      - name: Validate production configuration
        if: >-
          github.repository == 'CherryHQ/cherry-studio-website' &&
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: config
        env:
          CONTAINER_REGISTRY_HOST: ${{ vars.CONTAINER_REGISTRY_HOST }}
          CONTAINER_REGISTRY_PULL_HOST: ${{ vars.CONTAINER_REGISTRY_PULL_HOST }}
          CONTAINER_REGISTRY_NAMESPACE: ${{ vars.CONTAINER_REGISTRY_NAMESPACE }}
          CONTAINER_REGISTRY_AUTH_MODE: ${{ vars.CONTAINER_REGISTRY_AUTH_MODE }}
          CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: node .github/scripts/container-deploy.cjs config

      - name: Log in with registry credentials
        if: steps.config.outputs.authMode == 'credentials'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.config.outputs.host }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Log in to GHCR
        if: steps.config.outputs.authMode == 'github-token'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the tested image
        if: steps.config.outputs.tag != ''
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.config.outputs.tag }}
          # Match the single-platform image that was loaded and smoke tested.
          provenance: false
          sbom: false

      - name: Update the production GitOps image and digest
        if: steps.push.outputs.digest != ''
        env:
          SOURCE_TOKEN: ${{ github.token }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          DEPLOY_IMAGE: ${{ steps.config.outputs.pullImage }}
          BUILD_DIGEST: ${{ steps.push.outputs.digest }}
        run: node .github/scripts/container-deploy.cjs update
