name: Validate leaderboard parser

on:
  push:
    branches: [fix/leaderboard-rsc-parser]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade beautifulsoup4 pandas pytz lxml requests tabulate
      - name: Run leaderboard script
        env:
          LEADERBOARD_PRIMARY_PROVIDER: firecrawl
          LEADERBOARD_SECONDARY_PROVIDER: scraperapi
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python .github/scripts/fetch_leaderboard.py
      - name: Upload generated content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-rank-content
          path: |
            docs-site/content/other/model_rank
            docs-site/content/i18n/english/other/model_rank
          if-no-files-found: warn
