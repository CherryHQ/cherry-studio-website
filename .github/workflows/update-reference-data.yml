name: Update reference data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

# The job commits the refreshed snapshots back to the branch it runs on.
permissions:
  contents: write

jobs:
  update-reference-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade beautifulsoup4 pandas pytz lxml requests tabulate

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # A snapshot that cannot be fetched or parsed must keep its previous version, so both
      # scripts exit non-zero; whatever did refresh is still committed, and the run is failed
      # afterwards.
      - name: Fetch and update leaderboards
        id: leaderboard
        continue-on-error: true
        timeout-minutes: 20
        env:
          # 主 provider 必填；次 provider 留空即禁用。可选值：firecrawl / scraperapi
          LEADERBOARD_PRIMARY_PROVIDER: firecrawl
          LEADERBOARD_SECONDARY_PROVIDER: scraperapi
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python .github/scripts/fetch_leaderboard.py

      - name: Fetch and generate model reference pages
        id: models
        continue-on-error: true
        run: node .github/scripts/fetch_models.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Commits pushed with the default token do not trigger the docs workflow, so validate here.
      - name: Generate documentation content
        run: pnpm docs:generate

      - name: Require zero reported source issues
        run: |
          node -e "const r=require('./docs-site/generated/report.json'); if (r.issues.length) { console.error(JSON.stringify(r.issues, null, 2)); process.exit(1); } console.log('report.json: 0 source issues');"

      - name: Commit and push if there are changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A docs-site/content/other/model_rank/ docs-site/content/i18n/english/other/model_rank/ docs-site/content/other/models-info/ docs-site/content/i18n/english/other/models-info/ docs-site/public/models-search/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update reference data"
            git pull --rebase
            git push
          else
            echo "No changes to commit"
          fi

      - name: Fail when a snapshot could not be refreshed
        if: steps.leaderboard.outcome != 'success' || steps.models.outcome != 'success'
        run: exit 1
